<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcademiQ — Academic Discovery</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #1D9E75; --gl: #E1F5EE; --gd: #0F6E56; --gm: #9FE1CB;
            --amber: #f5a623; --bg: #F4F2EE; --s: #fff; --t: #1a1a18; --t2: #6b6b67;
            --r: 10px; --sh: 0 4px 12px rgba(0,0,0,0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "DM Sans", sans-serif; background: var(--bg); color: var(--t); line-height: 1.6; }
        
        /* Layout */
        .topbar { position: fixed; top: 0; width: 100%; height: 60px; background: var(--s); display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid rgba(0,0,0,0.1); z-index: 100; justify-content: space-between; }
        .logo { font-family: "DM Serif Display", serif; font-size: 22px; cursor: pointer; }
        .logo span { color: var(--green); }
        .tb-r { display: flex; gap: 15px; align-items: center; }

        /* Main Components */
        .main { margin-top: 60px; padding: 30px; max-width: 1100px; margin-left: auto; margin-right: auto; }
        .hero { background: linear-gradient(135deg, #0d6b4f, var(--green)); color: #fff; padding: 40px; border-radius: 15px; margin-bottom: 25px; }
        .hero h2 { font-family: "DM Serif Display", serif; font-size: 28px; margin-bottom: 10px; }
        
        /* Interactive Elements */
        .panel { background: var(--s); padding: 25px; border-radius: var(--r); box-shadow: var(--sh); margin-bottom: 20px; border-left: 4px solid var(--green); }
        .btn-p { background: var(--green); color: #fff; border: none; padding: 12px 24px; border-radius: var(--r); cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-p:hover { opacity: 0.9; transform: translateY(-1px); }
        
        /* Language & Alerts */
        .lang-select { padding: 5px; border-radius: 5px; border: 1px solid #ddd; font-family: inherit; }
        .alc { display: flex; align-items: center; gap: 10px; background: var(--gl); padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 14px; color: var(--gd); }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: #fff; padding: 12px 20px; border-radius: 8px; display: none; z-index: 200; }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="logo">Academi<span>Q</span></div>
        <div class="tb-r">
            <select class="lang-select" onchange="translateUI(this.value)">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="pt">Português</option>
            </select>
            <button class="btn-p" style="background:var(--amber)" data-i18n="btn_donate">Buy us a coffee</button>
        </div>
    </header>

    <main class="main">
        <section class="hero">
            <h2 data-i18n="hero_title">Find journals for your research</h2>
            <p data-i18n="hero_sub">Search 1,000,000+ journals across the African continent.</p>
        </section>

        <section class="panel">
            <h3 data-i18n="alert_h">🔔 Field Alerts</h3>
            <p data-i18n="alert_p">Get notified when new Calls for Papers (CFP) are published in your field.</p>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <select id="alert-field" class="lang-select" style="flex:1">
                    <option value="Agric">Agriculture</option>
                    <option value="Med">Medicine</option>
                    <option value="Tech">Technology</option>
                </select>
                <button class="btn-p" onclick="subscribeAlert()" data-i18n="btn_sub">Subscribe</button>
            </div>
            <div id="active-alerts"></div>
        </section>

        <div id="journal-results" class="panel" style="border-left-color: #ddd;">
            <p data-i18n="results_empty">Search results will appear here...</p>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script>
        // 1. DATA: Translations
        const i18n = {
            en: {
                hero_title: "Find journals for your research",
                hero_sub: "Search 1,000,000+ journals across the African continent.",
                btn_donate: "Buy us a coffee",
                alert_h: "🔔 Field Alerts",
                alert_p: "Get notified of new Calls for Papers (CFP) in your field.",
                btn_sub: "Subscribe",
                results_empty: "Search results will appear here..."
            },
            fr: {
                hero_title: "Trouvez des revues pour votre recherche",
                hero_sub: "Recherchez plus d'un million de revues en Afrique.",
                btn_donate: "Offrez-nous un café",
                alert_h: "🔔 Alertes de domaine",
                alert_p: "Soyez notifié des appels à contributions (CFP) dans votre domaine.",
                btn_sub: "S'abonner",
                results_empty: "Les résultats apparaîtront ici..."
            }
        };

        // 2. LOGIC: Language Engine
        function translateUI(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) el.innerText = i18n[lang][key];
            });
            localStorage.setItem('userLang', lang);
        }

        // 3. LOGIC: Alert System
        function subscribeAlert() {
            const field = document.getElementById('alert-field').value;
            const alertBox = document.getElementById('active-alerts');
            
            // UI Feedback
            const badge = document.createElement('div');
            badge.className = 'alc';
            badge.innerHTML = `<span>✓</span> Subscribed to <strong>${field}</strong> updates`;
            alertBox.appendChild(badge);
            
            showToast(`Alert set for ${field}!`);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        // Init language on load
        window.onload = () => {
            const saved = localStorage.getItem('userLang') || 'en';
            translateUI(saved);
        };
    </script>
</body>
</html>
